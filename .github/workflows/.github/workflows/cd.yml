name: Fraud Detection CD

on:
  workflow_run:
    workflows: ["Fraud Detection CI"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t fraud-detection-api:staging .

      - name: Run Docker container
        run: |
          docker run -d --name fraud-api -p 8000:8000 fraud-detection-api:staging

      - name: Wait for API
        run: sleep 10

      - name: Test health endpoint
        run: |
          curl --fail http://localhost:8000/health

      - name: Stop container
        if: always()
        run: |
          docker stop fraud-api || true
          docker rm fraud-api || true
